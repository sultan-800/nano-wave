{% extends "base.html" %}
{% block title %}Каталог - NanoWave{% endblock %}
{% block content %}
{% include "partials/back_button.html" %}
<h2 class="mb-3">Каталог товаров</h2>

<form class="row g-2 mb-4" method="get">
    <div class="col-md-5">
        <input type="text" class="form-control" name="q" placeholder="Поиск..." value="{{ query }}">
    </div>
    <div class="col-md-5">
        <select class="form-select" name="category">
            <option value="">Все категории</option>
            {% for item in categories %}
                <option value="{{ item['category'] }}" {% if category == item['category'] %}selected{% endif %}>
                    {{ item['category'] }}
                </option>
            {% endfor %}
        </select>
    </div>
    <div class="col-md-2">
        <button class="btn btn-primary w-100" type="submit">Фильтр</button>
    </div>
</form>

<div class="row g-3">
    {% for product in products %}
        {% include "partials/product_card.html" %}
    {% else %}
        <p>Товары не найдены.</p>
    {% endfor %}
</div>
{% endblock %}
