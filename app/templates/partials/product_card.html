<div class="col-md-4">
    <div class="card h-100 product-card{% if product['stock'] == 0 %} product-card--out-of-stock{% endif %}">
        <div class="product-card-image-wrap">
            {% if product['stock'] == 0 %}
                <span class="badge-out-of-stock">Нет в наличии</span>
            {% endif %}
            <img src="{{ url_for('static', filename='uploads/' + (product['image'] or 'placeholder.svg')) }}"
                 class="card-img-top product-image{% if product['stock'] == 0 %} product-image--dim{% endif %}"
                 alt="{{ product['title'] }}">
        </div>
        <div class="card-body d-flex flex-column">
            <div class="d-flex justify-content-between align-items-start gap-2">
                <h5 class="card-title mb-0">{{ product['title'] }}</h5>
            </div>
            <p class="card-text small text-muted">{{ product['category'] }}</p>
            <p class="card-text small text-muted flex-grow-1">{{ product['description'][:100] }}{% if product['description']|length > 100 %}...{% endif %}</p>
            <p class="fw-bold">{{ "%.2f"|format(product['price']) }} ₽</p>
            <a href="{{ url_for('main.product', product_id=product['id']) }}" class="btn btn-outline-dark btn-sm">
                Открыть карточку
            </a>
        </div>
    </div>
</div>
